[project]
name = "theoremlens"
version = "0.1.0"
description = "High-precision Local Math RAG pipeline for academic mathematical PDFs"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "mineru[pipeline,vlm]<4.0.0",
    "pgvector>=0.5.0",
    "psycopg2-binary>=2.9.13",
    "six>=1.17.0",
    "sqlalchemy>=2.0.54",
    "torch==2.6.0",
    "torchvision==0.21.0",
]

[tool.pyrefly]
python-interpreter-path = ".venv/Scripts/python.exe"

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
