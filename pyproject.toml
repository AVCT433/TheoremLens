[project]
name = "theoremlens"
version = "0.1.0"
description = "High-precision Local Math RAG pipeline for academic mathematical PDFs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "docling>=2.126.0",
    "chromadb>=1.5.9",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.0.1",
    "langchain-text-splitters>=1.1.2",
    "ollama>=0.6.2",
    "gradio>=6.26.0",
    "pydantic>=2.13.5",
    "numpy>=2.0.0",
    "einops>=0.8.0",
]

